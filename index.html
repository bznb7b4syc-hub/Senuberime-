<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sənubərimə ❤️</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffe4ec, #fff5f8);
      font-family: Arial, sans-serif;
    }

    .card {
      width: 85%;
      max-width: 500px;
      padding: 45px 25px;
      text-align: center;
      background: white;
      border-radius: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    }

    h1 {
      color: #e91e63;
      font-size: 38px;
      margin-bottom: 35px;
    }

    button {
      border: none;
      background: #e91e63;
      color: white;
      padding: 18px 35px;
      border-radius: 40px;
      font-size: 20px;
      cursor: pointer;
    }

    audio {
      width: 100%;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Sənubərimə ❤️</h1>

    <button onclick="document.getElementById('audio').play()">
      🎧 Səsi aç
    </button>

    <audio id="audio" controls>
      <source src="Sənubərim üçün.m4a" type="audio/mp4">
      Brauzeriniz audio faylını dəstəkləmir.
    </audio>
  </div>

</body>
</html>
